services:
    web:
        build:
            context: ./
            dockerfile: ./.docker/php/Dockerfile.local
        container_name: p61_app
        ports:
            - ${APP_PORT:-8234}:80
            - ${VITE_PORT:-5183}:${VITE_PORT:-5183}
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./vendor/:/var/www/vendor
        networks:
            - app-network
            - postgres_default
            - traefik_default
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.p61-app.rule=Host(`mz.localhost`)"
            - "traefik.http.routers.p61-app.entrypoints=web"
            - "traefik.http.services.p61-app.loadbalancer.server.port=80"
            - "traefik.docker.network=traefik_default"
